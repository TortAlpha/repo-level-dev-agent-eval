[project]
name = "repo-level-dev-agent-eval"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Roman Avanesov" }
]
dependencies = [
    "langchain-core==1.4.8",
    "langchain-openai==1.3.3",
    "langsmith==0.9.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
]

[project.scripts]
run = "src.run:main"
benchmark = "src.benchmark:main"
metrics = "src.metrics.report:main"
quality = "src.metrics.quality:main"
refresh-pricing = "src.metrics.pricing:main"

[project.optional-dependencies]
graph = [
    "langgraph==1.2.7",
]
dev = [
    "mypy==2.1.0",
    "ruff==0.15.20",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
